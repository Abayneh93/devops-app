apiVersion: v1
kind: Pod
metadata:
  name: multi-container-pod
  labels:
    app: multi-app
spec:
  containers:
  - name: app-container
    image: ghcr.io/abayneh93/devops-app:latest
    ports:
    - containerPort: 8000

  - name: sidecar-container
    image: busybox:latest
    command: ["sh", "-c", "mkdir -p /var/log && while true; do echo Sidecar monitoring backend at $(date) >> /var/log/app.log; sleep 5; done"]
