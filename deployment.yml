apiVersion: v1
kind: Pod
metadata:
  creationTimestamp: "2026-08-12T10:29:15Z"
  labels:
    app: remote-app-pod
  name: remote-app-pod
spec:
  containers:
  - image: nginx:alpine
    name: remote-app
    ports:
    - containerPort: 8000
      hostPort: 8080


apiVersion: apps/v1
kind: Deployment
metadata:
  name: remote-app-deployment
  labels:
    app: remote-app
spec:
  replicas: 8
  selector:
    matchLabels:
      app: remote-app
  template:
    metadata:
      labels:
        app: remote-app
      annotations:
        build-version: "v3-final-test"
    spec:
      containers:
      - name: remote-app-container
        image: ghcr.io/abayneh93/devops-app:latest
        env:
        - name: REPEAT_TEST
          value: "v2"
        ports:
        - containerPort: 8000
        livenessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 2
          periodSeconds: 5
