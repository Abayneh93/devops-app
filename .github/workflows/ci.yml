name: DevOps App CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Container Image
        run: |
          docker build -t my-custom-app:test .

      - name: Test Container Output
        run: |
          docker run -d --name test-app -p 8000:8000 my-custom-app:test
          sleep 3
          curl http://127.0.0.1:8000
