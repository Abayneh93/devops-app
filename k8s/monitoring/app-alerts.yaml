apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: my-app-alerts
  namespace: monitoring
  labels:
    release: prometheus
spec:
  groups:
  - name: my-app.rules
    rules:
    - alert: AppPodHighMemory
      expr: sum(container_memory_working_set_bytes{namespace="default"}) by (pod) > 50000000
      for: 1m
      labels:
        severity: warning
      annotations:
        summary: "High Memory Usage on {{ $labels.pod }}"
        description: "Pod {{ $labels.pod }} in default namespace is using over 50MB memory."
